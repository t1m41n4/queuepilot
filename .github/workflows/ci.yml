name: QueuePilot CI

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Run backend tests
        working-directory: backend
        run: pytest -q

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: npm ci && npm run build

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Start PostgreSQL and backend for integration tests
        run: docker compose up -d --wait db backend

      - name: Run PostgreSQL integration and concurrency tests
        run: |
          docker compose exec -T backend pip install -q -r requirements-dev.txt
          docker compose exec -T -e TEST_DATABASE_URL=postgresql+psycopg://queuepilot:queuepilot@db:5432/queuepilot backend pytest -q

      - name: Tear down integration stack
        if: always()
        run: docker compose down -v
